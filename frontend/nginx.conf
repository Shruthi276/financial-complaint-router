server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Basic hardening headers
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Make browsers re-check the page files on every visit, so a new UI
    # version shows up straight away (unchanged files get a quick 304).
    # add_header here replaces the server-level headers, so repeat them.
    location ~* \.(?:html|css|js)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
    }

    # config.js changes per deployment - never cache it
    location = /config.js {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
    }

    # Scraped by nginx-prometheus-exporter (internal network only)
    location = /nginx_status {
        stub_status;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }
}
